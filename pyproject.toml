[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "corpus-assay"
dynamic = ["version"]
description = "Fast, auditable n-gram detection of benchmark contamination in LLM training corpora (Rust-accelerated)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Victor May" }]
keywords = [
    "llm",
    "evaluation",
    "contamination",
    "decontamination",
    "benchmark",
    "n-gram",
    "data-quality",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "datasets>=4.4.2",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "tqdm>=4.66",
    "typer>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/mrcabbage972/corpus-assay"
Documentation = "https://github.com/mrcabbage972/corpus-assay/tree/main/docs"
Issues = "https://github.com/mrcabbage972/corpus-assay/issues"
Changelog = "https://github.com/mrcabbage972/corpus-assay/blob/main/CHANGELOG.md"

[project.scripts]
corpus-assay = "corpus_assay.cli:main"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pyright>=1.1.408",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.maturin]
python-source = "python"
module-name = "corpus_assay._native"
locked = true
strip = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: offline end-to-end CLI tests (subprocess, no network)"]

[tool.coverage.run]
branch = true
source = ["corpus_assay"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["corpus_assay"]
combine-as-imports = true

[tool.pyright]
include = ["python", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
