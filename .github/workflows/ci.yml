name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install (builds the extension)
        run: uv sync --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install (builds the extension)
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test
        run: uv run --no-sync pytest --cov=corpus_assay --cov-report=term-missing

  wheel:
    name: Wheel contents + offline e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build wheel
        run: uvx maturin build --release --locked --out dist
      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          print("\n".join(names))
          leaked = [n for n in names if n.endswith(".rs") or "Cargo." in n
                    or n.startswith(("target/", "tests/", "src/"))]
          assert not leaked, f"unexpected files in wheel: {leaked}"
          assert "corpus_assay/ngram_config.json" in names
          assert "corpus_assay/py.typed" in names
          native = [n for n in names
                    if n.startswith("corpus_assay/_native") and not n.endswith(".pyi")]
          assert len(native) == 1 and ".abi3." in native[0], native
          EOF
      - name: Install the wheel into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl pytest
      - name: Offline e2e against the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import corpus_assay; print(corpus_assay.__file__)"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest tests -m e2e -p no:cacheprovider
